name: Deploy progress dashboard

# Publish the progress dashboard to GitHub Pages.
#
# One target, `base` (EU retail base game 1.00, CUSA03745), built and gated
# on `main`; the site is assembled from main's docs/index.html and
# docs/base/{progress.json,PROGRESS.md} by .github/scripts/build_pages_site.sh.
# A second target would add its docs/<slug>/ to that script's SLUGS and a
# picker to the page.
on:
  push:
    branches: [main]
    # Only the files the site actually serves. docs/ also holds the project's
    # documentation, and a documentation edit is not a reason to redeploy.
    paths:
      - docs/index.html
      - docs/*/progress.json
      - docs/*/PROGRESS.md
      - .github/workflows/pages.yml
      - .github/scripts/build_pages_site.sh
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: .github/scripts/build_pages_site.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
